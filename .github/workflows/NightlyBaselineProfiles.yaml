name: NightlyBaselineProfiles

on:
  workflow_dispatch:
  schedule:
    - cron: '42 4 * * *'

concurrency:
  group: baseline-profiles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline_profiles:
    name: Generate Baseline Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Delete unnecessary tools
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}' | base64 --decode > app/src/debug/google-services.json
          echo '${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}' | base64 --decode > app/google-services.json

      - name: Generate release baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:generateReleaseBaselineProfile --stacktrace

      - name: Upload baseline profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profiles
          path: app/src/release/generated/baselineProfiles/
